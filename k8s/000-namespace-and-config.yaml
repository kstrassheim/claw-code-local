---
# Namespace only.
#
# TOOLS.md is no longer built here. The documents live in builder/tools-md/,
# ship in the image AND as the claw-tools-parts ConfigMap, and render-config
# assembles them into workspace/TOOLS.md at pod start using the ORDER file
# that travels with them.
#
# The previous arrangement assembled them in an ArgoCD pre-sync hook, which
# was the only copy of the order and the only way the file was ever produced:
# when the hook stopped running the pod kept serving a document 20KB behind
# the repository, with whole capabilities missing, and nothing reported it.
# Splitting per capability is still the right editorial choice — the assembled
# document is ~2k lines and a per-section edit should not scroll through it.
apiVersion: v1
kind: Namespace
metadata:
  name: claw-code
  labels:
    environment: dev
    project: claw-code-local
