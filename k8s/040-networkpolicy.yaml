---
# NOTE ON THE DEFAULT-DENY BASELINE
#
# This namespace is already default-deny in BOTH directions, and that policy is
# not declared here: a cluster-wide Kyverno policy generates a
# `default-deny-all` NetworkPolicy into every namespace. Everything below is
# additive on top of it.
#
# Declaring our own copy was tried and reverted. Two controllers then own one
# object, they take turns rewriting it, and the application never reaches
# Synced again — the symptom is a permanently OutOfSync app whose diff is
# empty, which is a genuinely confusing thing to debug. If the cluster policy
# is ever removed, add it back HERE and say so in this comment; until then the
# absence is deliberate, not an oversight.
---
# All-pods DNS egress to kube-system (resolves cluster service names
# and external hostnames via CoreDNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: claw-code-local
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
---
# The agent reaches the planning store.
#
# HTTPS egress is NOT repeated here — allow-https-egress below covers every
# pod in the namespace, and a second copy would only be another place to
# forget when it changes.
#
# Scoped to the database pod rather than opened as a bare port: an egress rule
# carrying only `ports` and no `to` permits that port to ANY destination,
# which would quietly turn a database allowance into general outbound access
# on 27017.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-egress-mongodb
  namespace: claw-code-local
spec:
  podSelector:
    matchLabels:
      app: openclaw
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: claw-code-mongodb
      ports:
        - protocol: TCP
          port: 27017
  policyTypes:
    - Egress
---
# The database accepts connections from this namespace and nowhere else.
#
# Without an ingress policy the pod is reachable by anything in the cluster
# that can route to it, and it runs without authentication — the credentials
# story here is "only the bot can reach the port", so this policy IS the
# authentication. If that ever stops being true, add a user before removing
# this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: claw-code-local
spec:
  podSelector:
    matchLabels:
      app: claw-code-mongodb
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 27017
  policyTypes:
    - Ingress
---
# HTTPS egress for every pod in the namespace.
#
# The CronJob pods (issue-watcher, tester, pr-reviewer) need this as much as
# the agent does: each one calls the GitHub API and `kubectl exec`s into the
# agent pod, which is the in-cluster API server on 443/6443. Before the
# default-deny baseline they were unrestricted and this went unnoticed;
# with it, omitting them would silently stop every planner at the first
# request and the only symptom would be a CronJob log nobody reads.
#
# No destination restriction: the targets are public provider APIs and the
# in-cluster API server, and pinning those by CIDR would be maintenance
# without benefit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: claw-code-local
spec:
  podSelector: {}
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress
---
# Ingress to the agent's gateway and bridge ports.
#
# Deliberately unrestricted as to SOURCE, which preserves exactly the reach
# these ports had before the default-deny baseline — an ingress controller in
# another namespace, a port-forward, or a direct ClusterIP call all keep
# working. Narrowing this is a separate, testable change: get it wrong and the
# chat surface goes dark after a sync, with the pod reporting itself healthy.
#
# What the baseline DOES buy here is that these are now the ONLY ports
# reachable on the agent pod. Everything else it happens to listen on —
# code-server, a dev server the tester leaves running, an MCP server bound
# wider than intended — is no longer reachable from anywhere in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: claw-code-local
spec:
  podSelector:
    matchLabels:
      app: openclaw
  ingress:
    - ports:
        - protocol: TCP
          port: 18789
        - protocol: TCP
          port: 18790
  policyTypes:
    - Ingress
