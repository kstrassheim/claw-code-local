---
# SKILL.md for the tester chat skill — mirrors the issue-watcher
# skill so the user can toggle the autonomous tester from chat
# (e.g. "tester stop") without an image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claw-code-skill-tester
  namespace: claw-code
data:
  SKILL.md: |
    ---
    name: tester
    # The description is the only thing that decides whether this file gets
    # read, so it has to name what the body actually answers — including the
    # three scan switches, which are the questions users ask about most.
    description: >-
      Control the autonomous deployment tester: start, stop and inspect it,
      and toggle its three optional scan passes — the static scan (SAST),
      the live security scan (pen test) and the AI code review.
    user-invocable: true
    ---

    # tester — control the autonomous deployment tester

    A CronJob `tester` (namespace `claw-code`) ticks every 10
    minutes, at :04, :14, :24 … — offset from the issue-watcher and the
    pull-request reviewer so no two planners fire in the same minute.
    On each tick it takes the **allowed-projects list** as its candidate
    list (`projects list`; a repository that is not on it is never
    tested), fetches each one's default-branch HEAD SHA, and **spawns a
    `tester-runner` subprocess inside this very pod** for each repo whose
    HEAD differs from the last-tested SHA on disk.

    It holds back entirely while the issue solver or the reviewer still
    have queued work — "first solve and merge, then test". A tick that
    did nothing says which it was: `tester held back — …`.

    The tester is a different role from the issue-fixer:
    - It does NOT edit code, push commits, or open PRs.
    - It inspects CI pipelines, drives the browser plugin to test
      deployed sites (including autonomous Entra MFA login), and
      collects errors from the browser + cloud-side logs.
    - It STAGES issue drafts during the run; the wrapper creates
      real GitHub issues with the right assignee AFTER the agent
      exits, dropping any draft that duplicates an already-open
      issue. Tester-created issues carry the label `tester`.
    - Findings from every pass are consolidated into ONE issue per
      root cause, not one per symptom.

    On top of the functional test it can run **three optional passes**,
    each toggled from chat and each **OFF BY DEFAULT** (see the
    `sast` / `pentest` / `codereview` commands below):

    | Pass | Switch | What it does |
    |---|---|---|
    | SAST | `tester sast on` | static scan of the whole tree at the tested commit |
    | pen test | `tester pentest on` | live scan of the deployed app — **also needs the repo's own `PENTEST_ALLOWED_HOSTS` file** |
    | AI code review | `tester codereview on` | reads the whole repository and reasons about it |

    **Concurrency: per-repo, capped at 1**, same as the fixer but
    on a separate lock dir (`~/.openclaw/.tester-locks/<owner>__<name>/`)
    so the two subsystems never block each other. Per-tester
    isolation for the browser profile (`BROWSER_PROFILE`) and
    Azure CLI (`AZURE_CONFIG_DIR`) is set per repo so parallel
    testers across different repos don't fight over the same
    local resources.

    Use this skill when the user says any of:

    | User says | Run |
    |---|---|
    | `tester status`, `is the tester on?`, `what's the tester doing?` | the status command |
    | `tester start`, `enable the tester` | the start command |
    | `tester stop`, `pause the tester`, `disable testing` | the stop command |
    | `tester list`, `what's being tested?`, `active testers` | the list command |
    | `tester logs <repo>` | tail the tester log for that repo |
    | `tester last <repo>` | print the last test-run summary for that repo |
    | `tester sast status`, `is the static scan on?` | the sast status command |
    | `tester sast on`, `enable sast`, `enable static scanning` | the sast on command |
    | `tester sast off`, `disable sast`, `stop static scanning` | the sast off command |
    | `tester pentest status`, `is the pen test on?` | the pentest status command |
    | `tester pentest on`, `enable pen tests` | the pentest on command |
    | `tester pentest off`, `disable pen tests`, `stop pen testing` | the pentest off command |
    | `tester codereview status`, `is the code review on?` | the codereview status command |
    | `tester codereview on`, `enable the ai code review` | the codereview on command |
    | `tester codereview off`, `disable the ai code review` | the codereview off command |

    ## Commands (run via your `exec` tool — kubectl is in PATH)

    ### status

    ```
    kubectl -n claw-code get cronjob tester \
      -o jsonpath='suspended={.spec.suspend}{"\n"}schedule={.spec.schedule}{"\n"}lastSchedule={.status.lastScheduleTime}{"\n"}lastSuccess={.status.lastSuccessfulTime}{"\n"}'
    ```

    Report `suspended=true` as **stopped**, `false` as **running**.

    Then run all three switch-status commands below and report **every
    one of them** on the same line, e.g.

    > running · SAST off · pen test off · AI code review off

    Never report the tester's state without the three switches: "running"
    on its own reads as "everything is being scanned", and by default
    none of the three passes is.

    ### start

    ```
    kubectl -n claw-code patch cronjob tester \
      -p '{"spec":{"suspend":false}}'
    ```

    ### stop

    Two operations: suspend the CronJob AND kill every in-flight
    tester subprocess. The user's intent on "stop" is "stop
    testing right now", not "block new ticks".

    ```
    kubectl -n claw-code patch cronjob tester \
      -p '{"spec":{"suspend":true}}'
    pkill -f '/usr/local/bin/tester-runner' || true
    rm -rf $HOME/.openclaw/.tester-locks/* 2>/dev/null
    ```

    Run all three. Then run the status command. Report:
      - the new suspended state, and
      - how many tester subprocesses were terminated (pkill returns
        non-zero when nothing matched — that's fine).

    ### list

    ```
    ls -1 $HOME/.openclaw/.tester-locks/ 2>/dev/null | sed 's|__|/|'
    ```

    Each line is an `<owner>/<name>` repo with an in-flight tester.
    Empty output = nothing is being tested right now.

    For details on what each tester is doing:

    ```
    pgrep -af '/usr/local/bin/tester-runner'
    ```

    ### logs

    For `tester logs <repo>` (e.g. `tester logs owner/repo`):

    ```
    tail -n 80 $HOME/.openclaw/tester-logs/<owner>_<name>.log
    ```

    (The slash in the repo name becomes an underscore. The tester
    log is one file per repo, appended across runs — different
    from fixer logs, which are one per issue.)

    ### last

    For `tester last <repo>` (most recent test-run summary):

    ```
    ls -1t $HOME/.openclaw/tester-summaries/<owner>__<name>-*.md | head -1 | xargs cat
    ```

    If no summary exists yet, report "no test runs for this repo".

    ### sast status / on / off

    The tester can run a STATIC scan (SAST) over the WHOLE tree at the
    tested commit: semgrep plus the `security` MCP tools — bandit,
    pip-audit, npm audit, PSScriptAnalyzer, and gitleaks over **both** the
    working tree and the git history (a credential that was committed and
    later "removed" is still recoverable, so history is its own scan).

    Unlike the pen test it needs **no per-repository authorisation**: it
    only reads the repository's own source, and never touches a running
    system. It is **OFF BY DEFAULT**; the switch is a flag file whose
    presence means on.

    **status**

    ```
    test -f $HOME/.openclaw/.sast-enabled && echo "SAST: ON" || echo "SAST: OFF (default)"
    ```

    **on** — run the static scan on every tested commit:

    ```
    touch $HOME/.openclaw/.sast-enabled
    ```

    **off** (the default; functional testing, pen test and AI code review
    are unaffected):

    ```
    rm -f $HOME/.openclaw/.sast-enabled
    ```

    Then run the status command and confirm the new state.

    ### pentest status / on / off

    The tester can run a LIVE SECURITY SCAN (pen test) of the deployed app
    through the `pentest` MCP. It is **OFF BY DEFAULT**, and it is
    **TRIPLE-GATED** — all three of these must hold or the scan is
    skipped, and the run states which one was missing:

    1. **the deploy checks for the tested commit succeeded** — otherwise
       there is no verified deployment of that commit to scan;
    2. **the target repository authorised it**, by committing a
       `PENTEST_ALLOWED_HOSTS` file to its ROOT naming its own host(s),
       one host or URL per line, `#` comments allowed;
    3. **this switch is on**.

    Point 2 is not a formality, and this switch cannot substitute for it.
    `PENTEST_ALLOWED_HOSTS` is a **human-only file in the target
    repository**: the runner sets the scanner's host allowlist from that
    file and from nothing else, so turning the pen test on here can never
    authorise a repository that did not opt in. Actively scanning a host
    nobody authorised can be illegal — if it isn't sure, it doesn't scan.

    **status** — is the pen test switched on?

    ```
    test -f $HOME/.openclaw/.pentest-enabled && echo "pen test: ON (runs only where the repo authorises it)" || echo "pen test: OFF (default)"
    ```

    **on** — switch the pen test on (it then runs for any repository that
    ships a `PENTEST_ALLOWED_HOSTS` file in its root and whose deploy
    checks are green):

    ```
    touch $HOME/.openclaw/.pentest-enabled
    ```

    Then run the status command and confirm **ON**. Remind the user that a
    repository still only gets scanned if it authorised it with a
    `PENTEST_ALLOWED_HOSTS` file in its root, and that the scan only ever
    targets the host(s) listed there.

    **off** — switch the pen test back off for every repository (this is
    the default; functional testing continues, only the live scan stops):

    ```
    rm -f $HOME/.openclaw/.pentest-enabled
    ```

    Then run the status command and confirm **OFF**. In-flight tester runs
    already past the scan step won't be interrupted; the next tick honours
    the switch.

    ### codereview status / on / off

    The tester can additionally do an **AI CODE REVIEW**: it reads the
    whole checked-out repository itself and reasons about it, rather than
    pattern-matching. It is a FULL review — security **and** general code
    quality:

    - security a ruleset cannot find: broken authorization, IDOR, missing
      server-side validation behind a validating UI, privilege escalation,
      tenant or data leakage, secrets reaching logs or the client bundle,
      SSRF, races, business-logic flaws;
    - correctness and robustness, API/data integrity, performance traps
      (N+1, unbounded queries), and maintainability problems that will
      cause the next bug.

    It runs AFTER SAST and the pen test so it can build on them, but does
    **not** depend on either — with both off (the default) it is the only
    look anyone takes at this code, and it does the security reasoning
    itself. Its findings become issues like any other: security ones
    titled with the `🔒 Security:` prefix, the rest as ordinary issues,
    all with the same duplicate check.

    It is **OFF BY DEFAULT** because it reads the entire repository, so it
    is the slowest and most token-expensive pass of a run.

    **status**

    ```
    test -f $HOME/.openclaw/.codereview-enabled && echo "AI code review: ON" || echo "AI code review: OFF (default)"
    ```

    **on**

    ```
    touch $HOME/.openclaw/.codereview-enabled
    ```

    **off** (the default):

    ```
    rm -f $HOME/.openclaw/.codereview-enabled
    ```

    Then run the status command and confirm the new state. When switching
    it ON, warn the user that each tester run will take noticeably longer
    and use considerably more tokens.

    ## Reporting style

    Keep replies terse. One line per piece of state, and always all three
    switches. Example:

    > Tester: **running** · SAST **off** · pen test **off** · AI code
    > review **off** · schedule `4-59/10 * * * *` · last fired
    > 2026-05-20T19:34:00Z · 0 testers active.
---
# ServiceAccount for the tester CronJob. Same pattern as
# issue-watcher: scoped to this namespace, only used to exec into
# the openclaw pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tester
  namespace: claw-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tester
  namespace: claw-code
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tester
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: tester
    namespace: claw-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tester
---
# The openclaw deployment's SA needs to be able to patch the tester
# CronJob's suspend field from chat ("tester stop / start"). Same
# field-scoped pattern as the watcher.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tester-control
  namespace: claw-code
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["tester"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tester-control
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: claw-code
    namespace: claw-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tester-control
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tester
  namespace: claw-code
  labels:
    app: tester
spec:
  # Slower schedule than the issue-watcher. Tester runs only fire
  # work when the default-branch HEAD changes per repo, so 10 min
  # is fine; running more often just burns API calls.
  #
  # OFFSET by 4 minutes from the issue-watcher (*/5) and by 2 from the
  # pull-request reviewer (2-59/5), so no two planners spawn in the same
  # minute: "4-59/10" fires at :04, :14, :24 … Same 10-minute cadence,
  # shifted start. Three planners landing together is how the reviewer
  # took a 429 on its first model call, run after run — see the
  # concurrency-gate header in builder/agent-slot.sh.
  schedule: "4-59/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  # spec.suspend deliberately omitted — same reasoning as the
  # issue-watcher: K8s defaults to false, ArgoCD ServerSideApply
  # leaves the absent field unmanaged so `tester stop` from chat
  # sticks across reconciles.
  jobTemplate:
    metadata:
      labels:
        app: tester
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: tester
        spec:
          serviceAccountName: tester
          # Pinned to datapi. The image is ~1.8GB and these fire every
          # 5-10 minutes; unpinned they landed on whichever node caught them,
          # so mainpi kept re-pulling it minutes after it was pruned — churning
          # snapshots on the node that also holds etcd and the registry and has
          # ~9GB free. datapi already runs the openclaw Deployment from the same
          # image and has ~108GB free, so the layers are there already.
          # The toleration is required: datapi carries data=true:NoSchedule.
          nodeSelector:
            kubernetes.io/hostname: datapi
          tolerations:
            - key: data
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes:
            - name: claw-scripts
              configMap:
                name: claw-scripts-planner
                defaultMode: 0755
          restartPolicy: Never
          imagePullSecrets:
            - name: registry-pull-secret
          containers:
            - name: tester
              image: claw-code-local-cron  # transformed by kustomize images: pin
              # NOT the agent image. This container finds the openclaw pod
              # and does the real work inside it with `kubectl exec`; what
              # runs here is one stdlib-only planner. See builder/cron/.
              imagePullPolicy: IfNotPresent
              # Named WITHOUT a directory so PATH decides, and PATH puts the
              # ConfigMap mount (/opt/claw-scripts) ahead of the image copy in
              # /usr/local/bin. Spelling the image path here made the mount
              # decorative for the whole spawn chain: the CronJob ran the
              # image's spawner, which spawned the image's runner, so a script
              # shipped by ConfigMap was never executed and an edit only landed
              # at the next version bump. A mount that fails still resolves —
              # to the image copy, stale but present.
              command: ["cron-tester-spawn"]
              env:
                # The mounted scripts win over the image's copies — see the
                # gateway deployment for why the image keeps a fallback set.
                - name: PATH
                  value: "/opt/claw-scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                - name: PYTHONPATH
                  value: "/opt/claw-scripts:/usr/local/bin"
              volumeMounts:
                # Planner half ONLY. These pods never execute a runner — they
                # find the openclaw pod and exec into it — so mounting the
                # runner half here would be 478KB the container cannot use.
                - name: claw-scripts
                  mountPath: /opt/claw-scripts
              envFrom:
                # GITHUB_TOKEN is the only secret the spawner itself
                # needs. Model API keys + ENTRA_* live in the openclaw
                # pod's env and are inherited by the spawned
                # tester-runner subprocesses.
                - secretRef:
                    name: claw-code-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  # Measured peak in this container: 18 MiB for python3 with
                  # every module the tick imports, plus 39 MiB for kubectl —
                  # ~57 MiB with both live. 192Mi is >3x that, which covers a
                  # larger `get pods` response as the namespace grows. The
                  # agent work this schedules runs in the openclaw pod, which
                  # has its own 5.5Gi limit; none of it happens here.
                  memory: 192Mi
