---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claw-code-local
resources:
  - 000-namespace-and-config.yaml
  - 005-pvc.yaml
  - 006-mongodb.yaml
  - 010-claw-code-config.yaml
  - 020-deployment.yaml
  - 030-service.yaml
  - 040-networkpolicy.yaml
  - 050-issue-watcher.yaml
  - 051-tester.yaml
  - 052-reviewer.yaml
  - 053-projects.yaml
  - 054-planning.yaml
  - 060-runner-rbac.yaml
  # The scripts, generated as ConfigMaps from builder/ itself.
  # A generator cannot read files above its own root, so the
  # generator lives beside the files and is referenced here.
  - ../builder
  # claw-code-secrets is no longer in git. The Deploy workflow's
  # publish-secrets job `kubectl apply`s it directly each run via
  # the RBAC in 060-runner-rbac.yaml. Argo CD doesn't manage that
  # Secret. If you ever need a "clean slate" bootstrap from git,
  # re-run the Deploy workflow (or workflow_dispatch the
  # apply-secrets job).
# Pin the openclaw image here so the deployment manifest stays static and
# Argo CD picks up new builds when this tag is bumped. Tag tracks
# OPENCLAW_VERSION in /VERSIONS — the deploy workflow rewrites this entry
# after a successful image push.
images:
  - name: claw-code-local
    newName: mainpi.local:30500/openclaw/claw-code-local
    newTag: v2026.7.1-2.22
  # The CronJobs run an orchestrator, not an agent: a stdlib-only planner and
  # some kubectl. Same tag as the image above and pinned in the same commit —
  # they share their scripts, so the pair must not drift.
  - name: claw-code-local-cron
    newName: mainpi.local:30500/openclaw/claw-code-local-cron
    newTag: v2026.7.1-2.22
