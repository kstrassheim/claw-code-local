---
# ServiceAccount + Role + RoleBinding so the render-config init container
# can patch the claw-code-config ConfigMap at pod start. Scoped tightly:
# only the claw-code-config ConfigMap in this namespace, get/patch/update.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claw-code
  namespace: claw-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-code-config-writer
  namespace: claw-code
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["claw-code-config"]
    verbs: ["get", "patch", "update", "create"]
---
# Read-only visibility of its OWN CronJobs.
#
# The three `*-control` Roles let the agent toggle each CronJob's `suspend`,
# but they are scoped with `resourceNames`, and Kubernetes RBAC does not
# honour resourceNames for `list` — a named grant covers `get` and nothing
# else. So the agent could read any one CronJob by name while `kubectl get
# cronjob` returned Forbidden.
#
# That is not a cosmetic gap. Asked whether it had any scheduled work at all,
# the agent ran the list, received a permission error, and reported that it
# had NO CronJobs — when all three existed and were running on schedule.
# A denial rendered as an absence is the worst answer available: it is
# confident, wrong, and points the reader at the wrong problem entirely.
#
# `list` cannot be narrowed to specific names, so this grants it across the
# namespace. That is an acceptable widening: the namespace holds only this
# bot's own CronJobs, the verb is read-only, and mutation stays name-scoped
# in the `*-control` Roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-code-cronjob-reader
  namespace: claw-code
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-code-cronjob-reader
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: claw-code
    namespace: claw-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claw-code-cronjob-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-code-config-writer
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: claw-code
    namespace: claw-code
roleRef:
  kind: Role
  name: claw-code-config-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-code
  namespace: claw-code
  labels:
    app: claw-code
    environment: dev
    project: claw-code-local
spec:
  replicas: 1
  # `Recreate` (not the default RollingUpdate): terminate the old pod first,
  # then start the new one. With replicas=1 and a RWO claw-code-workspace
  # PVC, RollingUpdate deadlocks — the new pod can't mount the volume
  # while the old pod still holds it, and maxUnavailable=0 keeps the old
  # one alive until the new one is Ready. Brief downtime on each deploy
  # in exchange for a deploy that actually finishes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claw-code
  template:
    metadata:
      labels:
        app: claw-code
      annotations:
        # (Was checksum/tools-md, forcing a rollout so a subPath mount of the
        # assembled TOOLS.md would refresh. render-config now assembles it from
        # the mounted parts at start, so there is no stale single-file mount to
        # work around.)
    spec:
      serviceAccountName: claw-code
      imagePullSecrets:
        - name: registry-pull-secret
      # Pin to datapi. The claw-code-workspace PVC uses the cluster-default
      # `local-path` StorageClass, which provisions a hostPath PV on the
      # node where this pod first schedules. Without an explicit pin, the
      # pod could land on mainpi (the only untainted node) and create the
      # workspace there — then the pod is stuck on mainpi forever because
      # the PV's nodeAffinity is set on first provision and can't move.
      # datapi is mostly idle behind a `data=true:NoSchedule` taint, so
      # we tolerate it and force-schedule there. Same pin used by
      # k8s-openclaw and the arc-runner-scale-claw-code-local runner pods.
      nodeSelector:
        kubernetes.io/hostname: datapi
      tolerations:
        - key: data
          operator: Equal
          value: "true"
          effect: NoSchedule
      # PVC mounts default to root:root. The openclaw container runs as
      # uid 1000 (node user) and writes config + identity + tasks into
      # /home/node/.openclaw — so the mounted volume must be group-writable
      # by gid 1000.
      # - fsGroup chgrp's the mount root to gid 1000.
      # - fsGroupChangePolicy=Always makes that recursive on every mount,
      #   so existing subdirs (e.g. `workspace/` from earlier deploys with
      #   the wrong mountPath) don't stay stuck at root:root.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
      initContainers:
        # Belt-and-suspenders on top of fsGroupChangePolicy: explicitly
        # chmod the existing files so group=node has rw on dirs and rw
        # on files. fsGroup only manages group ownership; if a file was
        # created without g+w from the previous (root-owned) mount,
        # node still can't write to it after the regroup. Runs as root
        # in a busybox-style shell from the openclaw image; idempotent.
        - name: fix-perms
          image: claw-code
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          env:
            # Internal CA PEM (optional). When present it is imported into the
            # Chromium NSS store below so the tester trusts internal HTTPS
            # ingresses. Absent → skipped, no behaviour change.
            - name: INTERNAL_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: INTERNAL_CA_CERT
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              # Pre-create workspace/ before the kubelet's subPath mount of
              # TOOLS.md auto-creates it as root:root 0755 (the parent dir
              # of a subPath is created by kubelet running as root, and is
              # then NOT touched by fsGroup, leaving the in-pod uid 1000
              # unable to write AGENTS.md and friends into it).
              mkdir -p /home/node/.openclaw/workspace
              mkdir -p /home/node/.openclaw/workspace/skills/developer
              mkdir -p /home/node/.openclaw/workspace/skills/tester
              mkdir -p /home/node/.openclaw/workspace/skills/reviewer
              mkdir -p /home/node/.openclaw/workspace/skills/projects
              mkdir -p /home/node/.openclaw/workspace/skills/planning
              chown -R 1000:1000 /home/node/.openclaw
              chmod -R u+rwX,g+rwX /home/node/.openclaw

              # Trust the internal CA in Chromium's NSS store ($HOME/.pki/nssdb,
              # shared with the main container via the `pki` emptyDir) so the
              # tester can open internal HTTPS deploy URLs without
              # ERR_CERT_AUTHORITY_INVALID. Best-effort: never blocks startup.
              if [ -n "${INTERNAL_CA_CERT:-}" ] && [ "${INTERNAL_CA_CERT}" != "null" ]; then
                mkdir -p /home/node/.pki/nssdb
                printf '%s\n' "$INTERNAL_CA_CERT" > /home/node/.pki/internal-ca.crt
                certutil -d sql:/home/node/.pki/nssdb -A -n internal-ca -t "C,," \
                  -i /home/node/.pki/internal-ca.crt \
                  && echo "Imported internal CA into Chromium NSS store" \
                  || echo "WARN: internal CA import failed — continuing without it"
                chown -R 1000:1000 /home/node/.pki
                chmod -R u+rwX,g+rwX /home/node/.pki
              else
                echo "INTERNAL_CA_CERT not set — skipping internal CA trust"
              fi

              # Hand the skill-load directories to root and make them
              # read-only, so the agent cannot install itself a new skill at
              # runtime. A skill is just instructions the agent will follow,
              # so one it wrote for itself is the shortest way around every
              # other control here — the allowed-projects list included.
              #
              # MUST run last: it is undone by any recursive
              # `chown -R 1000:1000` of the state dir, and both chowns above
              # are exactly that.
              #
              # Fails CLOSED. If the binary is missing the image is not the
              # one we think it is, and starting anyway would leave the
              # directories writable with nothing reporting it.
              if [ ! -x /usr/local/bin/lock-skill-dirs ]; then
                echo "FATAL: lock-skill-dirs missing from the image — refusing to start" >&2
                exit 1
              fi
              /usr/local/bin/lock-skill-dirs
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw
            - name: pki
              mountPath: /home/node/.pki
        # Seeds the allowed-projects list the FIRST time a workspace volume
        # comes up, and never again.
        #
        # After that first boot the list belongs to the `projects` chat skill
        # and lives on the volume, so PROJECTS_ALLOWED_BOOTSTRAP is ignored on
        # every subsequent start. That is the whole point: if a deploy re-seeded
        # the list, revoking a repository would last only until the next
        # rollout, and a permission that comes back on its own is not a
        # permission boundary.
        #
        # Runs as uid 1000 so the list it writes is owned by the account that
        # has to rewrite it later from chat.
        - name: seed-allowed-projects
          image: claw-code
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
          env:
            - name: PROJECTS_ALLOWED_BOOTSTRAP
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: PROJECTS_ALLOWED_BOOTSTRAP
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              # Fails CLOSED on a missing binary: an image without the
              # permission CLI is not the image we think it is, and starting
              # anyway would leave every subsystem deciding for itself what it
              # may touch.
              if [ ! -x /usr/local/bin/project-allow ]; then
                echo "FATAL: project-allow missing from the image — refusing to start" >&2
                exit 1
              fi
              # `bootstrap` is a no-op when a list already exists, and makes no
              # network call, so a platform outage can never gate the rollout.
              /usr/local/bin/project-allow bootstrap
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw
        # Reads the canonical template from /template, decides whether
        # MiniMax is reachable based on $MINIMAX_API_KEY, strips it with
        # node if not, and writes the rendered result back into the live
        # claw-code-config ConfigMap.
        - name: render-config
          image: claw-code
          imagePullPolicy: Always
          command: ["/bin/sh", "/scripts/render-config.sh"]
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MISTRAL_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MINIMAX_API_KEY
                  optional: true
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MOONSHOT_API_KEY
                  optional: true
            # Comma-separated hostnames the tester's browser plugin is
            # allowed to reach on the private network (RFC1918). Kept out
            # of the public config template; injected by render-config.sh
            # into browser.ssrfPolicy.allowedHostnames. optional:true so
            # the pod still boots when the key is absent.
            - name: TESTER_ALLOWED_HOSTNAMES
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: TESTER_ALLOWED_HOSTNAMES
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: render-scripts
              mountPath: /scripts
            # The parts render-config assembles TOOLS.md from. It falls back to
            # the image's copy under /usr/local/share/claw-tools when this is
            # absent, so a ConfigMap that fails to apply costs freshness, not
            # the whole document.
            - name: claw-tools-parts
              mountPath: /opt/claw-tools
            - name: workspace
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: claw-code
          image: claw-code
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              name: web
            - containerPort: 18790
              name: bridge
          envFrom:
            - configMapRef:
                name: claw-code-config
            - secretRef:
                name: claw-code-secrets
          env:
            - name: OPENCLAW_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: claw-code-config-template
                  key: OPENCLAW_IMAGE
                  optional: true
            # Planning store. An unset or unreachable store is a SUPPORTED
            # state, not an error: documents spool to the workspace volume and
            # flush when the database comes back, so the solver never waits on
            # it and never fails because of it.
            - name: PLANNING_MONGO_URI
              value: "mongodb://claw-code-mongodb:27017"
            - name: PLANNING_MONGO_DB
              value: "planning"
            # The host segment of every planning document key. Must match what
            # the runners pass to `planning-record --host`, or the delivery
            # sweep looks up keys nothing ever wrote and silently records
            # nothing at all.
            - name: PLANNING_HOST
              value: "github"
            # How many agent runs may hold a model slot at once, across the
            # solver, tester and reviewer. The chat bot is deliberately NOT
            # gated by this — a user asking a question must never queue behind
            # an hour-long autonomous run.
            # 4, twice the library's default of 2.
            #
            # WHAT THE OLD CEILING ACTUALLY MEASURED, because the library
            # does not say and it reads like a law of nature.
            #
            # agent-slot.sh calls 3 "the measured ceiling" and defaults to 2
            # for headroom, on the grounds that going one over costs every run
            # in flight. That was measured against KIMI, whose rate limits are
            # what produced the 429s — it is a property of one provider, not of
            # the bot. The fallback (minimax) has room for 4, so the number
            # that was right under kimi is simply the wrong number now.
            #
            # Raised here rather than in the library so that reasoning stays
            # intact, and so this is one `kubectl set env` to undo. The signal
            # is `secondsOn429` on the work documents in the planning store:
            # it is per-provider, so if kimi ever becomes primary again this
            # needs revisiting rather than assuming 4 still holds.
            #
            # Memory was never what gated this — the pod used ~1.6Gi of 5.5Gi
            # with two solvers in flight. The limit is raised alongside so four
            # runs FIT, which is a different question from whether the provider
            # will serve them.
            # The mounted scripts must WIN over the copies baked into the
            # image, or an edit appears to do nothing: everything still runs,
            # just the older version, which is the worst way for this to fail.
            # The image copies stay as a fallback so it works standalone.
            - name: PATH
              value: "/opt/claw-scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            # The ticks import by bare name (`import forge`), so the same
            # ordering has to hold for modules, not just executables.
            - name: PYTHONPATH
              value: "/opt/claw-scripts:/usr/local/bin"
            - name: MAX_AGENT_SLOTS
              value: "4"
          volumeMounts:
            # Mount the PVC at the WHOLE openclaw state directory, not just
            # the `workspace/` subdir. Previously openclaw.json, identity/,
            # tasks/, plugin-skills/, logs/ all lived on the container's
            # ephemeral filesystem and were wiped on every pod restart —
            # which made Telegram re-pair on every restart because the
            # commands.ownerAllowFrom config (and the auth token under
            # identity/) didn't persist.
            - name: workspace
              mountPath: /home/node/.openclaw
            # Chromium NSS trust store, populated by the fix-perms init
            # container (internal CA) so the tester trusts internal HTTPS.
            - name: pki
              mountPath: /home/node/.pki
            # `developer` chat skill — drives the kubectl toggle
            # commands for the issue-fixer subsystem. ConfigMap source
            # is in 050-issue-watcher.yaml (the CronJob name stays
            # `issue-watcher`, but the user-facing skill name is
            # `developer`). Changes flow through ArgoCD; pod restart
            # required to pick up subPath updates.
            # Mount path is workspace/skills/ (NOT plugin-skills/) —
            # openclaw's loadWorkspaceSkillEntries scans <workspaceDir>/
            # skills/, and plugin-skills/ is reserved for installed
            # plugin extensions.
            - name: skill-developer
              mountPath: /home/node/.openclaw/workspace/skills/developer/SKILL.md
              subPath: SKILL.md
            - name: skill-tester
              mountPath: /home/node/.openclaw/workspace/skills/tester/SKILL.md
              subPath: SKILL.md
            - name: skill-reviewer
              mountPath: /home/node/.openclaw/workspace/skills/reviewer/SKILL.md
              subPath: SKILL.md
            - name: skill-projects
              mountPath: /home/node/.openclaw/workspace/skills/projects/SKILL.md
              subPath: SKILL.md
            - name: skill-planning
              mountPath: /home/node/.openclaw/workspace/skills/planning/SKILL.md
              subPath: SKILL.md
            # NO subPath — a subPath mount is a one-time copy and never sees a
            # ConfigMap update, which is exactly what the skills above accept
            # (they need a restart to change). These must refresh in place, so
            # they mount as a directory and kubelet syncs them within ~a minute.
            - name: claw-scripts
              mountPath: /opt/claw-scripts
            # The parts render-config assembles TOOLS.md from, and which the
            # document cross-references by name ~40 times. Mounted under
            # workspace/tools rather than the root, which would shadow
            # AGENTS.md, IDENTITY.md and SOUL.md.
            - name: claw-tools-parts
              mountPath: /home/node/.openclaw/workspace/tools
          resources:
            requests:
              cpu: 600m
              memory: 1500Mi
            limits:
              cpu: 1700m
              # 8Gi, raised with MAX_AGENT_SLOTS 2 -> 4. Each concurrent agent
              # run carries its own node process and tool subprocesses, so the
              # ceiling has to move with the slot count or the fourth run OOMs
              # the pod and takes the other three with it.
              #
              # Headroom, not a forecast: measured use with two solvers in
              # flight was ~1.6Gi of the previous 5.5Gi, so this is not close
              # to binding. It is a limit rather than a request, and datapi has
              # ~32Gi, so nothing is reserved by raising it.
              #
              # Memory was never the constraint on slot count — see
              # MAX_AGENT_SLOTS above, where the real ceiling is in-flight
              # model requests. This makes four runs FIT; it does not make
              # four runs SAFE.
              memory: 8Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        # ONE directory from TWO ConfigMaps. The split exists because the
        # cron pods need only the planner half and mount that alone; the
        # gateway needs both, and a projected volume merges them so there is a
        # single entry on PATH and PYTHONPATH rather than an ordering question
        # between two directories.
        #
        # 0755 because these are executed — a ConfigMap defaults to 0644.
        - name: claw-tools-parts
          configMap:
            name: claw-tools-parts
        - name: claw-scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: claw-scripts-planner
              - configMap:
                  name: claw-scripts-runner
        - name: workspace
          persistentVolumeClaim:
            claimName: claw-code-workspace
        # Chromium NSS trust store ($HOME/.pki), shared between the fix-perms
        # init container (which imports the internal CA) and the main container.
        - name: pki
          emptyDir: {}
        - name: skill-developer
          configMap:
            name: claw-code-skill-developer
        - name: skill-tester
          configMap:
            name: claw-code-skill-tester
        - name: skill-reviewer
          configMap:
            name: claw-code-skill-reviewer
        - name: skill-projects
          configMap:
            name: claw-code-skill-projects
        - name: skill-planning
          configMap:
            name: claw-code-skill-planning
        - name: config-template
          configMap:
            name: claw-code-config-template
        - name: render-scripts
          configMap:
            name: claw-code-render-scripts
            defaultMode: 0755
