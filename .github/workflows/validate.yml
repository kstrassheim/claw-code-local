name: Verify

# Every gate that decides what reaches main.
#
# The cheap checks run first on hosted runners and the image build depends on
# them. That ordering is deliberate: the build clones upstream openclaw and
# produces a multi-hundred-megabyte arm64 image on the one self-hosted runner
# scale set, and there is no reason to spend that on a branch whose tests do
# not pass. A failing unit test now costs about a minute instead of the better
# part of an hour of runner time.
#
# The cheap checks also run on pushes to main, not only on pull requests, so a
# merge that lands while two pull requests were green in isolation still gets
# checked.
#
# The IMAGE BUILD does not. Deploy builds the identical commit on the same
# self-hosted runner, so running it here too meant every push to main produced
# TWO multi-hundred-megabyte arm64 builds of the same source. That is not just
# waste: the runner shares a node with the control plane, and the load from it
# has been enough to make the API server refuse connections and wedge the
# storage provisioner. It also gave a flaky upstream build two chances to fail
# per push instead of one.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Install git
        # The checkout tests drive REAL git against a real repository rather
        # than a mock, because the block they pin is the one that once
        # discarded work. No pip install: the suite is standard-library
        # unittest on purpose — the runtime image has no pip packages beyond
        # the store driver, and a suite that only runs where someone
        # remembered to install a framework is a suite that stops being run.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure git identity
        # The checkout tests commit; git refuses to without an identity.
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run the suite
        run: |
          cd builder/tests
          python -m unittest discover -s . -p 'test_*.py' -v

  function-coverage:
    name: Function Coverage Ledger
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # A ledger, not a coverage percentage: half of what ships is shell, and no
    # tool in this image can instrument a bash function. This fails when a NEW
    # untested function appears, so the gap can shrink but never grow
    # silently. Closing gaps is deliberate work; letting them open is not.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Report
        run: python builder/tools/function-inventory.py
      - name: Fail on a new untested function
        run: python builder/tools/function-inventory.py --check

  check-python-names:
    name: Undefined Names
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan
        # py_compile accepts an undefined name — it is a runtime NameError. A
        # planner that references a variable which does not exist crashes on
        # every tick, and the only symptom is a stack trace in a CronJob log
        # nobody reads, so the subsystem is dead until someone looks. That
        # happened once; this job is why it cannot happen quietly again.
        run: python builder/tools/check-undefined-names.py

  check-model-config:
    name: Model Config
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # The model configuration is JSON inside a ConfigMap, so it cannot carry
    # comments, and every property it encodes fails SILENTLY when removed — no
    # error, no log line, just a bot that is worse at its job.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Check
        run: python builder/tools/check-model-config.py

  check-tools-docs:
    name: Tools Documentation
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # Both ways a tools document can be written, merged and then never reach
    # the agent: left out of the hook's hardcoded cat list, or silently
    # truncated past the bootstrap cap.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check
        run: python builder/tools/check-tools-docs.py

  check-llm-secrets:
    name: LLM Secrets
    runs-on: ubuntu-latest
    # Fails fast if no model provider is configured. openclaw needs at least
    # one, and discovering that at pod start means a deploy that rolls out and
    # then does nothing.
    steps:
      - name: At least one provider key must be set
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ] && [ -z "$MINIMAX_API_KEY" ] && [ -z "$MOONSHOT_API_KEY" ]; then
            echo "::error::None of MOONSHOT_API_KEY, MINIMAX_API_KEY or MISTRAL_API_KEY is set. openclaw needs at least one."
            exit 1
          fi
          if [ -z "$MOONSHOT_API_KEY" ]; then
            echo "::warning::MOONSHOT_API_KEY is not set — the default model is unavailable and the render step will fall back."
          fi
          echo "OK - at least one provider key is configured."

  verify-skills-locked:
    name: Skills Lockdown
    runs-on: ubuntu-latest
    # Static half of the supply-chain guard: the agent must not be able to
    # grant itself new capabilities at runtime. The dynamic half — actually
    # trying to defeat the lockdown as uid 1000 — runs inside the built image
    # in verify-build, because it needs the image to exist.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check
        run: sh builder/verify-skills-locked.sh

  verify-build:
    name: Verify Image Build
    # Pull requests only — see the note at the top of this file. On a push to
    # main, Deploy builds this exact commit; a second identical build proves
    # nothing and costs the same twenty minutes on the same runner.
    if: github.event_name == 'pull_request'
    needs:
      - unit-tests
      - function-coverage
      - check-python-names
      - check-model-config
      - check-tools-docs
      - check-llm-secrets
      - verify-skills-locked
    runs-on: arc-runner-scale-claw-code-local
    env:
      IMAGE_NAME: ${{ vars.OPENCLAW_REGISTRY_URL }}/openclaw/claw-code-local
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Versions
        run: |
          . ./VERSIONS
          echo "UPSTREAM_REF=${OPENCLAW_UPSTREAM}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${OPENCLAW_VERSION}" >> "$GITHUB_ENV"
          echo "GH_CLI_VERSION=${GH_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "GITHUB_MCP_SERVER_VERSION=${GITHUB_MCP_SERVER_VERSION}" >> "$GITHUB_ENV"
          echo "GLAB_VERSION=${GLAB_VERSION}" >> "$GITHUB_ENV"
          echo "GITLAB_MCP_VERSION=${GITLAB_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "TERRAFORM_VERSION=${TERRAFORM_VERSION}" >> "$GITHUB_ENV"
          echo "TERRAFORM_MCP_VERSION=${TERRAFORM_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "OPENTOFU_VERSION=${OPENTOFU_VERSION}" >> "$GITHUB_ENV"
          echo "OPENTOFU_MCP_VERSION=${OPENTOFU_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "CODE_SERVER_VERSION=${CODE_SERVER_VERSION}" >> "$GITHUB_ENV"
          echo "AWS_CLI_VERSION=${AWS_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "GCLOUD_VERSION=${GCLOUD_VERSION}" >> "$GITHUB_ENV"
          echo "ALIYUN_CLI_VERSION=${ALIYUN_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "PYMONGO_VERSION=${PYMONGO_VERSION}" >> "$GITHUB_ENV"
          echo "GIT_LFS_VERSION=${GIT_LFS_VERSION}" >> "$GITHUB_ENV"
          echo "KUBELOGIN_VERSION=${KUBELOGIN_VERSION}" >> "$GITHUB_ENV"
          echo "SEMGREP_VERSION=${SEMGREP_VERSION}" >> "$GITHUB_ENV"
          echo "SEMGREP_MCP_VERSION=${SEMGREP_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "BANDIT_VERSION=${BANDIT_VERSION}" >> "$GITHUB_ENV"
          echo "PIP_AUDIT_VERSION=${PIP_AUDIT_VERSION}" >> "$GITHUB_ENV"
          echo "GITLEAKS_VERSION=${GITLEAKS_VERSION}" >> "$GITHUB_ENV"
          echo "PWSH_VERSION=${PWSH_VERSION}" >> "$GITHUB_ENV"
          echo "PSSCRIPTANALYZER_VERSION=${PSSCRIPTANALYZER_VERSION}" >> "$GITHUB_ENV"
          echo "PESTER_VERSION=${PESTER_VERSION}" >> "$GITHUB_ENV"
          echo "DOTNET_SDK_VERSION=${DOTNET_SDK_VERSION}" >> "$GITHUB_ENV"
          echo "SQLPACKAGE_VERSION=${SQLPACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_ACCOUNTS_VERSION=${AZ_ACCOUNTS_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_AUTOMATION_VERSION=${AZ_AUTOMATION_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_DATAFACTORY_VERSION=${AZ_DATAFACTORY_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_SYNAPSE_VERSION=${AZ_SYNAPSE_VERSION}" >> "$GITHUB_ENV"
          echo "NUCLEI_VERSION=${NUCLEI_VERSION}" >> "$GITHUB_ENV"
          echo "NUCLEI_TEMPLATES_VERSION=${NUCLEI_TEMPLATES_VERSION}" >> "$GITHUB_ENV"
          echo "TESTSSL_VERSION=${TESTSSL_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        # DOCKER_HOST is set by the dind sidecar to a TLS socket.
        # That causes docker CLI to look for /home/runner/.docker/ca.pem
        # which doesn't exist. Clear it so docker falls back to the
        # default plain unix socket — buildx handles the rest.
        uses: docker/setup-buildx-action@v3
        env:
          DOCKER_HOST: ""

      - name: Trust mainpi Registry CA
        # `docker buildx imagetools create` (used in the mirror step
        # below) makes direct HTTPS calls from the runner process
        # itself — it does NOT go through the dind dockerd, so the
        # /etc/docker/certs.d mount that trusts mainpi.local:30500
        # for `docker pull/push` is invisible to it. The mainpi-ca
        # ConfigMap is mounted on the runner pod at
        # /usr/local/share/ca-certificates/mainpi-ca.crt (Debian
        # trust-source dir), but no update-ca-certificates has run
        # yet, so the cert isn't in /etc/ssl/certs/ca-certificates.crt
        # (the bundle Go reads). Trigger the update so the runner
        # process trusts the cert before any imagetools call.
        # Without this: `tls: failed to verify certificate: x509:
        # certificate signed by unknown authority` against
        # mainpi.local:30500.
        run: |
          sudo update-ca-certificates 2>&1 | tail -5

      - name: Log In To Registry
        # docker buildx imagetools reads auth from ~/.docker/config.json,
        # which `docker login` writes to. Without this step, the mirror
        # step below hits mainpi.local with no auth and gets
        # `401 Unauthorized` on the destination blob HEAD.
        # REGISTRY_USERNAME / REGISTRY_PASSWORD are injected into the
        # runner pod's env via envFrom registry-creds in
        # shared/runner-values.yaml — not GH secrets.
        run: |
          test -n "${REGISTRY_USERNAME:-}" || { echo "::error::REGISTRY_USERNAME missing in runner env (registry-creds Secret)"; exit 1; }
          test -n "${REGISTRY_PASSWORD:-}" || { echo "::error::REGISTRY_PASSWORD missing in runner env (registry-creds Secret)"; exit 1; }
          echo "${REGISTRY_PASSWORD}" | docker login "${{ vars.OPENCLAW_REGISTRY_URL }}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Require OPENCLAW_REGISTRY_URL
        run: |
          if [[ -z "${{ vars.OPENCLAW_REGISTRY_URL }}" ]]; then
            echo "::error::OPENCLAW_REGISTRY_URL is not set. Cannot proceed."
            exit 1
          fi

      # The base image is TAKEN, not built. It used to be cloned from upstream
      # and rebuilt here as well — twelve minutes of it — and then the step
      # below passed the MIRRORED image as BASE_IMAGE and the locally built
      # one was never used by anything. What this job verifies is that our own
      # Dockerfile builds on top of the base, and that is unaffected.
      - name: Ensure openclaw-base is mirrored from GHCR into local registry
        run: |
          SRC_TAG="${UPSTREAM_REF#v}"
          SRC="ghcr.io/openclaw/openclaw:${SRC_TAG}"
          DST="${{ vars.OPENCLAW_REGISTRY_URL }}/openclaw/openclaw-base:${UPSTREAM_REF}"
          if docker manifest inspect "${DST}" >/dev/null 2>&1; then
            echo ">> ${DST} already mirrored, skipping"
          else
            docker buildx imagetools create --tag "${DST}" "${SRC}"
          fi

      - name: Extend Image with Python Packages
        run: |
          docker build \
            --build-arg "BASE_IMAGE=${{ vars.OPENCLAW_REGISTRY_URL }}/openclaw/openclaw-base:${UPSTREAM_REF}" \
            --build-arg "EPHE_FETCH_NONCE=${IMAGE_TAG}" \
            --build-arg "GH_CLI_VERSION=${GH_CLI_VERSION}" \
            --build-arg "GITHUB_MCP_SERVER_VERSION=${GITHUB_MCP_SERVER_VERSION}" \
            --build-arg "GLAB_VERSION=${GLAB_VERSION}" \
            --build-arg "GITLAB_MCP_VERSION=${GITLAB_MCP_VERSION}" \
            --build-arg "TERRAFORM_VERSION=${TERRAFORM_VERSION}" \
            --build-arg "TERRAFORM_MCP_VERSION=${TERRAFORM_MCP_VERSION}" \
            --build-arg "OPENTOFU_VERSION=${OPENTOFU_VERSION}" \
            --build-arg "OPENTOFU_MCP_VERSION=${OPENTOFU_MCP_VERSION}" \
            --build-arg "CODE_SERVER_VERSION=${CODE_SERVER_VERSION}" \
            --build-arg "AWS_CLI_VERSION=${AWS_CLI_VERSION}" \
            --build-arg "GCLOUD_VERSION=${GCLOUD_VERSION}" \
            --build-arg "ALIYUN_CLI_VERSION=${ALIYUN_CLI_VERSION}" \
            --build-arg "PYMONGO_VERSION=${PYMONGO_VERSION}" \
            --build-arg "GIT_LFS_VERSION=${GIT_LFS_VERSION}" \
            --build-arg "KUBELOGIN_VERSION=${KUBELOGIN_VERSION}" \
            --build-arg "SEMGREP_VERSION=${SEMGREP_VERSION}" \
            --build-arg "SEMGREP_MCP_VERSION=${SEMGREP_MCP_VERSION}" \
            --build-arg "BANDIT_VERSION=${BANDIT_VERSION}" \
            --build-arg "PIP_AUDIT_VERSION=${PIP_AUDIT_VERSION}" \
            --build-arg "GITLEAKS_VERSION=${GITLEAKS_VERSION}" \
            --build-arg "PWSH_VERSION=${PWSH_VERSION}" \
            --build-arg "PSSCRIPTANALYZER_VERSION=${PSSCRIPTANALYZER_VERSION}" \
            --build-arg "PESTER_VERSION=${PESTER_VERSION}" \
            --build-arg "DOTNET_SDK_VERSION=${DOTNET_SDK_VERSION}" \
            --build-arg "SQLPACKAGE_VERSION=${SQLPACKAGE_VERSION}" \
            --build-arg "AZ_ACCOUNTS_VERSION=${AZ_ACCOUNTS_VERSION}" \
            --build-arg "AZ_AUTOMATION_VERSION=${AZ_AUTOMATION_VERSION}" \
            --build-arg "AZ_DATAFACTORY_VERSION=${AZ_DATAFACTORY_VERSION}" \
            --build-arg "AZ_SYNAPSE_VERSION=${AZ_SYNAPSE_VERSION}" \
            --build-arg "NUCLEI_VERSION=${NUCLEI_VERSION}" \
            --build-arg "NUCLEI_TEMPLATES_VERSION=${NUCLEI_TEMPLATES_VERSION}" \
            --build-arg "TESTSSL_VERSION=${TESTSSL_VERSION}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            builder/

      - name: Only allowlisted bundled skills may ship
        # An upstream skill that survives the strip is a capability the agent
        # can load at runtime, outside the static MCP allowlist. The strip
        # cannot be trusted to have worked — `rm -rf` on a path that moved in
        # an upstream release exits 0 and does nothing — so this asks the
        # FINISHED image what is loadable in it and diffs that against the
        # allowlist.
        #
        # It asks by running the image's own `list-loadable-skills`, rather
        # than by searching the filesystem itself. An earlier version did its
        # own search and got a different answer from the one the build used:
        # it did not exclude node_modules, so two npm dependencies that happen
        # to ship a SKILL.md failed a build in which nothing was actually
        # wrong. One definition, one implementation, every caller runs it.
        run: |
          docker run --rm --entrypoint list-loadable-skills \
            "${IMAGE_NAME}:${IMAGE_TAG}" > /tmp/shipped-skills.txt
          grep -vE '^\s*(#|$)' builder/BUNDLED_SKILLS_ALLOWED | sort -u > /tmp/allowed-skills.txt
          if ! extra=$(comm -23 /tmp/shipped-skills.txt /tmp/allowed-skills.txt) || [ -n "$extra" ]; then
            echo "::error::bundled skills shipped that BUNDLED_SKILLS_ALLOWED does not list:"
            echo "$extra"
            exit 1
          fi
          echo "OK - no unlisted bundled skills in the image."

      - name: The lockdown must actually hold
        # The static check says the manifests are right; this one tries to
        # defeat the real lockdown as uid 1000 inside the real image. It also
        # checks the lockdown did not go too far — the agent must still be
        # able to write its own workspace file, or chat dispatch dies with
        # EACCES on every turn.
        run: |
          docker run --rm --user 0 \
            -v "$PWD/builder/verify-lockdown-effective.sh:/tmp/verify.sh:ro" \
            --entrypoint sh "${IMAGE_NAME}:${IMAGE_TAG}" /tmp/verify.sh

      - name: Reclaim runner disk
        # The scale set shares a dind host across jobs and ran out of disk
        # without this. Always, so a failed build still cleans up after
        # itself.
        if: always()
        run: |
          docker rmi "${IMAGE_NAME}:${IMAGE_TAG}" >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true