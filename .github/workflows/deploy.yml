name: Deploy

on:
  push:
    branches: [main]
    # publish-secrets pushes its re-seal commit through actions/checkout's
    # default GITHUB_TOKEN, which GitHub does not re-trigger workflows for
    # (built-in anti-recursion). That alone bounds the publish loop, so
    # we don't need a paths filter. An earlier paths-ignore on the sealed
    # file also silently dropped empty merges / commits that touched no
    # paths — including the empty PR used to manually rotate secrets —
    # so the filter is gone.
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Upstream openclaw git ref to build (tag/branch/commit). Defaults to OPENCLAW_UPSTREAM in root VERSIONS file. When set, the resulting image is also tagged with this ref.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  wait-for-verify:
    name: Wait For Verify
    runs-on: ubuntu-latest
    # WHY THE BUILD WAITS.
    #
    # Verify and Deploy both trigger on the same push, so they used to race:
    # on 2026-08-21 a commit whose unit tests failed still built and pushed an
    # image, because nothing connected the two workflows. The image was fine
    # that time — the failure was in a test's own calling convention — but the
    # pipeline had no opinion either way, which is the actual problem.
    #
    # A `workflow_run` trigger is the other way to do this. It is not used
    # because it runs in the context of the DEFAULT BRANCH and hands you the
    # triggering commit only as an input, so every checkout in this file would
    # have to thread that SHA through correctly or silently deploy the wrong
    # tree. Polling keeps `github.sha` meaning what it says.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Verify checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # Verify builds an image of its own to prove the Dockerfile still
          # builds. Waiting for it here would mean building the same image
          # twice in series before anything ships — this job builds its own
          # a few steps later regardless. The CHECKS are what must pass.
          SKIP_JOB: Verify Image Build
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")"

            if [ -n "$run_id" ]; then
              # Every check except the image build, as "name<TAB>status<TAB>conclusion".
              jobs="$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq ".jobs[] | select(.name != \"${SKIP_JOB}\") | [.name, .status, .conclusion] | @tsv" \
                2>/dev/null || echo "")"

              if [ -n "$jobs" ]; then
                # Fail as soon as one does, rather than after the slowest.
                bad="$(printf '%s\n' "$jobs" | awk -F'\t' '$2=="completed" && $3!="success" && $3!="skipped" {print $1" ("$3")"}')"
                if [ -n "$bad" ]; then
                  echo "::error::Verify checks failed on ${SHA}: ${bad}"
                  exit 1
                fi
                pending="$(printf '%s\n' "$jobs" | awk -F'\t' '$2!="completed" {print $1}')"
                if [ -z "$pending" ]; then
                  echo "All Verify checks passed on ${SHA}:"
                  printf '%s\n' "$jobs" | awk -F'\t' '{print "  "$1": "$3}'
                  exit 0
                fi
                echo "waiting on: $(printf '%s' "$pending" | tr '\n' ' ')"
              else
                echo "Verify run ${run_id} has no jobs yet, waiting..."
              fi
            else
              # A push always starts one, so this is scheduling delay rather
              # than absence — but do not wait forever for something that may
              # never appear.
              echo "no Verify run for ${SHA} yet, waiting..."
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for the Verify checks on ${SHA}"
              exit 1
            fi
            sleep 20
          done

  build-and-push-image:
    name: Build Image
    runs-on: arc-runner-scale-claw-code-local
    needs: [publish-secrets, wait-for-verify]
    env:
      REGISTRY: ${{ vars.OPENCLAW_REGISTRY_URL }}
      IMAGE_NAME: ${{ vars.OPENCLAW_REGISTRY_URL }}/openclaw/claw-code-local
      OPENCLAW_REPO: https://github.com/openclaw/openclaw.git
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Versions
        id: resolve
        run: |
          . ./VERSIONS
          if [ -n "${{ github.event.inputs.git_ref }}" ]; then
            UPSTREAM_REF="${{ github.event.inputs.git_ref }}"
            IMAGE_TAG="${{ github.event.inputs.git_ref }}"
          else
            UPSTREAM_REF="$OPENCLAW_UPSTREAM"
            IMAGE_TAG="$OPENCLAW_VERSION"
          fi
          echo "UPSTREAM_REF=${UPSTREAM_REF}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "CLAWHUB_VERSION=${CLAWHUB_VERSION}" >> "$GITHUB_ENV"
          echo "GH_CLI_VERSION=${GH_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "GITHUB_MCP_SERVER_VERSION=${GITHUB_MCP_SERVER_VERSION}" >> "$GITHUB_ENV"
          echo "GLAB_VERSION=${GLAB_VERSION}" >> "$GITHUB_ENV"
          echo "GITLAB_MCP_VERSION=${GITLAB_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "TEA_VERSION=${TEA_VERSION}" >> "$GITHUB_ENV"
          echo "GITEA_MCP_VERSION=${GITEA_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "AZDO_MCP_VERSION=${AZDO_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "TERRAFORM_VERSION=${TERRAFORM_VERSION}" >> "$GITHUB_ENV"
          echo "TERRAFORM_MCP_VERSION=${TERRAFORM_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "OPENTOFU_VERSION=${OPENTOFU_VERSION}" >> "$GITHUB_ENV"
          echo "OPENTOFU_MCP_VERSION=${OPENTOFU_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "CODE_SERVER_VERSION=${CODE_SERVER_VERSION}" >> "$GITHUB_ENV"
          echo "MERMAID_CLI_VERSION=${MERMAID_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "AWS_CLI_VERSION=${AWS_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "GCLOUD_VERSION=${GCLOUD_VERSION}" >> "$GITHUB_ENV"
          echo "ALIYUN_CLI_VERSION=${ALIYUN_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "PYMONGO_VERSION=${PYMONGO_VERSION}" >> "$GITHUB_ENV"
          echo "GIT_LFS_VERSION=${GIT_LFS_VERSION}" >> "$GITHUB_ENV"
          echo "KUBELOGIN_VERSION=${KUBELOGIN_VERSION}" >> "$GITHUB_ENV"
          echo "SEMGREP_VERSION=${SEMGREP_VERSION}" >> "$GITHUB_ENV"
          echo "SEMGREP_MCP_VERSION=${SEMGREP_MCP_VERSION}" >> "$GITHUB_ENV"
          echo "BANDIT_VERSION=${BANDIT_VERSION}" >> "$GITHUB_ENV"
          echo "PIP_AUDIT_VERSION=${PIP_AUDIT_VERSION}" >> "$GITHUB_ENV"
          echo "GITLEAKS_VERSION=${GITLEAKS_VERSION}" >> "$GITHUB_ENV"
          echo "PWSH_VERSION=${PWSH_VERSION}" >> "$GITHUB_ENV"
          echo "PSSCRIPTANALYZER_VERSION=${PSSCRIPTANALYZER_VERSION}" >> "$GITHUB_ENV"
          echo "PESTER_VERSION=${PESTER_VERSION}" >> "$GITHUB_ENV"
          echo "DOTNET_SDK_VERSION=${DOTNET_SDK_VERSION}" >> "$GITHUB_ENV"
          echo "SQLPACKAGE_VERSION=${SQLPACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_ACCOUNTS_VERSION=${AZ_ACCOUNTS_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_AUTOMATION_VERSION=${AZ_AUTOMATION_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_DATAFACTORY_VERSION=${AZ_DATAFACTORY_VERSION}" >> "$GITHUB_ENV"
          echo "AZ_SYNAPSE_VERSION=${AZ_SYNAPSE_VERSION}" >> "$GITHUB_ENV"
          echo "NUCLEI_VERSION=${NUCLEI_VERSION}" >> "$GITHUB_ENV"
          echo "NUCLEI_TEMPLATES_VERSION=${NUCLEI_TEMPLATES_VERSION}" >> "$GITHUB_ENV"
          echo "TESTSSL_VERSION=${TESTSSL_VERSION}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log In To Registry
        run: |
          test -n "${REGISTRY_USERNAME:-}"
          test -n "${REGISTRY_PASSWORD:-}"
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      # `docker manifest inspect` is a CLI-SIDE HTTPS call. It does not go
      # through the dind dockerd, so the /etc/docker/certs.d mount that lets
      # `docker pull` and `docker push` trust mainpi.local:30500 is invisible
      # to it. The CA is mounted on the runner pod at
      # /usr/local/share/ca-certificates/, but nothing has folded it into the
      # bundle Go reads, so the call fails with `x509: certificate signed by
      # unknown authority`.
      #
      # Which was invisible, because the check below sends that error to
      # /dev/null and reads a non-zero exit as "the image is not built yet".
      # So the skip NEVER fired: every deploy rebuilt and re-pushed an image
      # that already existed, including deploys of commits that do not change
      # the image at all. Twenty minutes, every time.
      #
      # validate.yml hit this first and documents it against
      # `buildx imagetools`; the same fix is the same one line.
      - name: Trust The Registry CA From The Runner Itself
        run: |
          sudo update-ca-certificates 2>&1 | tail -3

      - name: Skip If Image Already Built
        id: skip
        run: |
          # Errors are reported rather than swallowed. "Cannot reach the
          # registry" and "the image is not there" lead to the same decision —
          # build it — but only one of them is a problem, and the difference
          # has to be visible in the log or it stays invisible for months.
          if err="$(docker manifest inspect "${IMAGE_NAME}:${IMAGE_TAG}" 2>&1 >/dev/null)"; then
            echo ">> ${IMAGE_NAME}:${IMAGE_TAG} already in registry, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            case "$err" in
              *"manifest unknown"*|*"not found"*|*"no such manifest"*)
                echo ">> ${IMAGE_NAME}:${IMAGE_TAG} is not built yet" ;;
              *)
                echo "::warning::could not ask the registry whether ${IMAGE_TAG} exists — building it. ${err}" ;;
            esac
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The upstream image is built ONCE PER UPSTREAM REF, not once per deploy.
      #
      # It used to be rebuilt every time, and that cost far more than the ~12
      # minutes it spent: the base build is multi-stage, and BuildKit's inline
      # cache records only the FINAL stage, so its `build` and `runtime-assets`
      # stages re-ran on every deploy however well the cache worked. A base
      # image that is rebuilt is a base image with a NEW ID, and the image ID
      # of `FROM` is part of the cache key of every layer above it — so our own
      # Dockerfile, ninety-odd layers of it, could never reuse a single one.
      # It did not: zero cache hits, every run, eighteen minutes.
      #
      # The ref is pinned in VERSIONS and changes about monthly, so it is
      # keyed by REF rather than kept under one moving `buildcache-base` tag.
      # A hit skips the clone and the base build entirely; a miss is the first
      # deploy after an upstream bump and pays what it always paid.
      - name: Reuse The Upstream Image For This Ref
        id: base
        if: steps.skip.outputs.skip != 'true'
        run: |
          if docker pull "${IMAGE_NAME}:base-${UPSTREAM_REF}" 2>/dev/null; then
            docker tag "${IMAGE_NAME}:base-${UPSTREAM_REF}" \
                       "openclaw-base:${UPSTREAM_REF}"
            echo ">> reusing the upstream image already built for ${UPSTREAM_REF}"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo ">> no upstream image for ${UPSTREAM_REF} yet — building it"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Upstream OpenClaw
        if: steps.skip.outputs.skip != 'true' && steps.base.outputs.have != 'true'
        run: |
          git clone --depth 1 "${OPENCLAW_REPO}" _openclaw_src
          cd _openclaw_src
          git fetch --tags --force
          git -c advice.detachedHead=false checkout "${UPSTREAM_REF}"

      - name: Build Upstream Image
        if: steps.skip.outputs.skip != 'true' && steps.base.outputs.have != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          # A CORRUPT CACHE MUST NOT BE ABLE TO FAIL THE BUILD.
          #
          # `--cache-from` against a layer whose blob is truncated does not
          # degrade to a cache miss — it aborts with
          # `failed to compute cache key: short read ... unexpected EOF`, and
          # every build then fails identically until someone deletes the tag
          # by hand. That happened: three consecutive deploys failed this way,
          # and the error names a cache key rather than anything the change
          # touched, so it reads like a broken build.
          #
          # A truncated blob is written whenever a push is interrupted, which
          # on this registry is a routine event (it shares a disk that has
          # filled before). So the cache is treated as a hint: use it if it
          # works, discard it and build cold if it does not.
          docker pull "${IMAGE_NAME}:buildcache-base" 2>/dev/null || true
          if ! docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "${IMAGE_NAME}:buildcache-base" \
            -t "openclaw-base:${UPSTREAM_REF}" \
            -t "${IMAGE_NAME}:buildcache-base" \
            _openclaw_src; then
            echo "::warning::base build failed with the registry cache; retrying without it"
            docker rmi "${IMAGE_NAME}:buildcache-base" 2>/dev/null || true
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --no-cache \
              -t "openclaw-base:${UPSTREAM_REF}" \
              -t "${IMAGE_NAME}:buildcache-base" \
              _openclaw_src
          fi
          # Pushing a freshly built cache is what REPLACES a corrupt one, so
          # the recovery is self-healing rather than one-shot.
          docker push "${IMAGE_NAME}:buildcache-base" || true
          # And the ref-keyed copy, which is what every LATER deploy of this
          # same upstream ref pulls instead of doing any of the above. Pushed
          # last: a tag that exists must name an image that was built, or the
          # next run reuses a half-pushed base and fails in a way that reads
          # like a code change broke the build.
          docker tag "openclaw-base:${UPSTREAM_REF}" \
                     "${IMAGE_NAME}:base-${UPSTREAM_REF}"
          docker push "${IMAGE_NAME}:base-${UPSTREAM_REF}" || true

      # A KEPT TAG IS NEVER GARBAGE COLLECTED, so this deletes its own.
      #
      # The registry's weekly `garbage-collect --delete-untagged` reclaims
      # manifests that no tag points at. `base-<ref>` IS a tag, so without
      # this every upstream bump would leave a whole base image behind for
      # good — on a disk that is shared and has filled before.
      #
      # Deletion is by MANIFEST DIGEST, because the API has no delete-a-tag:
      # removing a digest removes every tag that names it. So a digest any
      # KEPT tag also names is left alone — the tags of one unchanged build
      # routinely share a digest, and `latest` and the running version tag
      # usually do — or this would delete the deployed image while reporting
      # that it tidied up an old base.
      #
      # Never fatal: a deploy that shipped must not read as failed because
      # the housekeeping after it could not reach the registry.
      - name: Forget Base Images For Superseded Upstream Refs
        if: steps.skip.outputs.skip != 'true' && steps.base.outputs.have != 'true'
        continue-on-error: true
        env:
          REGISTRY_USERNAME: ${{ secrets.OPENCLAW_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.OPENCLAW_REGISTRY_PASSWORD }}
        run: |
          python3 - <<'CLEANUP'
          import base64, json, os, ssl, urllib.error, urllib.request

          host = os.environ["REGISTRY"]
          repo = "openclaw/claw-code-local"
          keep_ref = os.environ["UPSTREAM_REF"]
          api = f"https://{host}/v2/{repo}"
          cred = base64.b64encode(
              f'{os.environ["REGISTRY_USERNAME"]}:{os.environ["REGISTRY_PASSWORD"]}'
              .encode()).decode()
          # The registry serves a certificate from the cluster's own CA, which
          # the runner does not carry. This talks to it by IP inside the
          # cluster and sends credentials, not anonymous requests.
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ACCEPT = ", ".join([
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.oci.image.index.v1+json",
          ])

          def call(method, path, accept=False):
              req = urllib.request.Request(f"{api}{path}", method=method)
              req.add_header("Authorization", f"Basic {cred}")
              if accept:
                  req.add_header("Accept", ACCEPT)
              return urllib.request.urlopen(req, timeout=30, context=ctx)

          try:
              with call("GET", "/tags/list") as r:
                  tags = json.load(r).get("tags") or []
          except Exception as exc:
              print(f">> could not list tags ({exc}) — nothing cleaned")
              raise SystemExit(0)

          def digest(tag):
              try:
                  with call("GET", f"/manifests/{tag}", accept=True) as r:
                      return r.headers.get("Docker-Content-Digest") or ""
              except Exception:
                  return ""

          stale = [t for t in tags
                   if t.startswith("base-") and t != f"base-{keep_ref}"]
          if not stale:
              print(">> no base image from a superseded upstream ref")
              raise SystemExit(0)

          keep = {digest(t) for t in tags if t not in stale}
          keep.discard("")

          for tag in stale:
              d = digest(tag)
              if not d:
                  continue
              if d in keep:
                  print(f">> keeping {tag}: a tag still in use names the same image")
                  continue
              try:
                  call("DELETE", f"/manifests/{d}").close()
                  print(f">> forgot {tag} — the weekly collection reclaims its blobs")
              except urllib.error.HTTPError as exc:
                  print(f">> could not delete {tag}: HTTP {exc.code}")
              except Exception as exc:
                  print(f">> could not delete {tag}: {exc}")
          CLEANUP

      - name: Extend Image with Python Packages
        if: steps.skip.outputs.skip != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          # Build arguments are collected once so the cached and uncached
          # attempts below cannot drift apart. Two hand-maintained copies of a
          # thirty-entry list is how one of them quietly loses a pin.
          BUILD_ARGS=(
            "BUILDKIT_INLINE_CACHE=1 "
            "BASE_IMAGE=openclaw-base:${UPSTREAM_REF}"
            "EPHE_FETCH_NONCE=${IMAGE_TAG}"
            "GH_CLI_VERSION=${GH_CLI_VERSION}"
            "GITHUB_MCP_SERVER_VERSION=${GITHUB_MCP_SERVER_VERSION}"
            "GLAB_VERSION=${GLAB_VERSION}"
            "GITLAB_MCP_VERSION=${GITLAB_MCP_VERSION}"
            "TEA_VERSION=${TEA_VERSION}"
            "GITEA_MCP_VERSION=${GITEA_MCP_VERSION}"
            "AZDO_MCP_VERSION=${AZDO_MCP_VERSION}"
            "TERRAFORM_VERSION=${TERRAFORM_VERSION}"
            "TERRAFORM_MCP_VERSION=${TERRAFORM_MCP_VERSION}"
            "OPENTOFU_VERSION=${OPENTOFU_VERSION}"
            "OPENTOFU_MCP_VERSION=${OPENTOFU_MCP_VERSION}"
            "CODE_SERVER_VERSION=${CODE_SERVER_VERSION}"
            "MERMAID_CLI_VERSION=${MERMAID_CLI_VERSION}"
            "AWS_CLI_VERSION=${AWS_CLI_VERSION}"
            "GCLOUD_VERSION=${GCLOUD_VERSION}"
            "ALIYUN_CLI_VERSION=${ALIYUN_CLI_VERSION}"
            "PYMONGO_VERSION=${PYMONGO_VERSION}"
            "GIT_LFS_VERSION=${GIT_LFS_VERSION}"
            "KUBELOGIN_VERSION=${KUBELOGIN_VERSION}"
            "SEMGREP_VERSION=${SEMGREP_VERSION}"
            "SEMGREP_MCP_VERSION=${SEMGREP_MCP_VERSION}"
            "BANDIT_VERSION=${BANDIT_VERSION}"
            "PIP_AUDIT_VERSION=${PIP_AUDIT_VERSION}"
            "GITLEAKS_VERSION=${GITLEAKS_VERSION}"
            "PWSH_VERSION=${PWSH_VERSION}"
            "PSSCRIPTANALYZER_VERSION=${PSSCRIPTANALYZER_VERSION}"
            "PESTER_VERSION=${PESTER_VERSION}"
            "DOTNET_SDK_VERSION=${DOTNET_SDK_VERSION}"
            "SQLPACKAGE_VERSION=${SQLPACKAGE_VERSION}"
            "AZ_ACCOUNTS_VERSION=${AZ_ACCOUNTS_VERSION}"
            "AZ_AUTOMATION_VERSION=${AZ_AUTOMATION_VERSION}"
            "AZ_DATAFACTORY_VERSION=${AZ_DATAFACTORY_VERSION}"
            "AZ_SYNAPSE_VERSION=${AZ_SYNAPSE_VERSION}"
            "NUCLEI_VERSION=${NUCLEI_VERSION}"
            "NUCLEI_TEMPLATES_VERSION=${NUCLEI_TEMPLATES_VERSION}"
            "TESTSSL_VERSION=${TESTSSL_VERSION}"
          )
          ARGS=()
          for a in "${BUILD_ARGS[@]}"; do ARGS+=(--build-arg "$a"); done

          # Same reasoning as the base build: a truncated cache blob aborts
          # the build instead of missing, so the cache is a hint and never a
          # dependency. Pushing the fresh cache afterwards replaces the
          # corrupt one, so this heals rather than needing a manual delete.
          docker pull "${IMAGE_NAME}:buildcache-final" 2>/dev/null || true
          if ! docker build "${ARGS[@]}" \
            --cache-from "${IMAGE_NAME}:buildcache-final" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:buildcache-final" \
            builder/; then
            echo "::warning::image build failed with the registry cache; retrying without it"
            docker rmi "${IMAGE_NAME}:buildcache-final" 2>/dev/null || true
            docker build "${ARGS[@]}" \
              --no-cache \
              -t "${IMAGE_NAME}:${IMAGE_TAG}" \
              -t "${IMAGE_NAME}:latest" \
              -t "${IMAGE_NAME}:buildcache-final" \
              builder/
          fi

      - name: Push Image
        if: steps.skip.outputs.skip != 'true'
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:buildcache-final" || true


  build-cron-image:
    name: Build Cron Image
    runs-on: arc-runner-scale-claw-code-local
    # PARALLEL WITH THE AGENT IMAGE, on purpose: it shares no layers with it
    # and nothing in it depends on that build. Same `needs` as the big job, so
    # the two start together and the deploy is gated on the slower of the two
    # rather than their sum — and both wait on the Verify checks first.
    needs: [publish-secrets, wait-for-verify]
    env:
      REGISTRY: ${{ vars.OPENCLAW_REGISTRY_URL }}
      IMAGE_NAME: ${{ vars.OPENCLAW_REGISTRY_URL }}/openclaw/claw-code-local-cron
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Version
        run: |
          . ./VERSIONS
          if [ -n "${{ github.event.inputs.git_ref }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.git_ref }}"
          else
            IMAGE_TAG="$OPENCLAW_VERSION"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      # The registry is authenticated. Credentials reach the job from the
      # runner's own environment; without this step the build succeeds and the
      # PUSH fails with "no basic auth credentials", several minutes in.
      - name: Log In To Registry
        run: |
          test -n "${REGISTRY_USERNAME:-}"
          test -n "${REGISTRY_PASSWORD:-}"
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      # `docker manifest inspect` below is a CLI-SIDE HTTPS call: it does not
      # go through the dind dockerd, so the certs.d mount that lets push and
      # pull trust the registry is invisible to it. Same one line as the agent
      # build, for the same reason.
      - name: Trust The Registry CA From The Runner Itself
        run: |
          sudo update-ca-certificates 2>&1 | tail -3

      - name: Skip If Already Built
        id: skip
        # Same cache-key reasoning as the agent image: the tag IS the key, and
        # re-pushing the same one ships nothing. Both images carry the same
        # OPENCLAW_VERSION so a bump rebuilds the pair and they cannot drift.
        #
        # Errors are reported rather than swallowed: "cannot reach the
        # registry" and "not built yet" lead to the same decision, but only
        # one of them is a problem, and swallowing it hid a broken skip for
        # months on the agent build.
        run: |
          if err="$(docker manifest inspect "${IMAGE_NAME}:${IMAGE_TAG}" 2>&1 >/dev/null)"; then
            echo ">> ${IMAGE_NAME}:${IMAGE_TAG} already in registry, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            case "$err" in
              *"manifest unknown"*|*"not found"*|*"no such manifest"*)
                echo ">> ${IMAGE_NAME}:${IMAGE_TAG} is not built yet" ;;
              *)
                echo "::warning::could not ask the registry whether ${IMAGE_TAG} exists — building it. ${err}" ;;
            esac
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.skip.outputs.skip != 'true'
        # Context is builder/, so the COPYs in cron/Dockerfile name the scripts
        # directly — the same paths the agent image uses.
        run: |
          docker build \
            -f builder/cron/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            builder

      - name: Push
        if: steps.skip.outputs.skip != 'true'
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

  pin-image-tags:
    name: Pin Image Tags
    runs-on: arc-runner-scale-claw-code-local
    # ONE JOB, ONE COMMIT. Two jobs that each git-push race and one of them
    # loses — which is why the pin waits for BOTH images rather than each
    # build pinning its own entry.
    #
    # It also must not run before both images exist: a manifest naming a tag
    # that has not been pushed leaves Argo CD pulling a missing image for the
    # length of the other build.
    needs: [build-and-push-image, build-cron-image]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Version
        run: |
          . ./VERSIONS
          if [ -n "${{ github.event.inputs.git_ref }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.git_ref }}"
          else
            IMAGE_TAG="$OPENCLAW_VERSION"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          curl -sLo "$HOME/.local/bin/yq" \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}"
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin Image Tag In Kustomization
        # Bump k8s/kustomization.yaml so Argo CD picks up the new tag. Without
        # this step, an OPENCLAW_VERSION bump rebuilds and pushes the image but
        # never reaches the cluster.
        #
        # THE REBASE COMES FIRST, AND A LOWER VERSION IS REFUSED.
        #
        # This used to write the pin, commit, and only then `git pull --rebase`.
        # With two deploys in flight — which is what three commits pushed a few
        # minutes apart produces — the slower run replayed its own older pin on
        # top of the newer one and won. The registry then held -2.5 while the
        # manifest asked for -2.4, so a fix that had built and pushed
        # successfully was simply never deployed, and every workflow was green.
        #
        # Rebasing first means the comparison is against what main actually
        # says right now; refusing to move the pin BACKWARDS means a late
        # finisher can no longer undo a newer deploy. Equal is a no-op, and a
        # tag that is not in our version scheme (a workflow_dispatch build of
        # an arbitrary ref) skips the comparison and pins as before.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::warning::could not rebase onto main — leaving the pin alone; the next push reapplies it"
            exit 0
          fi

          CURRENT="$(yq -r '(.images[] | select(.name == "claw-code-local") | .newTag)' k8s/kustomization.yaml)"
          echo "pinned now: ${CURRENT}   this build: ${IMAGE_TAG}"

          if [ "$CURRENT" = "$IMAGE_TAG" ]; then
            echo "already pinned to ${IMAGE_TAG} — nothing to do"
            exit 0
          fi

          # Only compare when BOTH look like our scheme; otherwise a dispatch
          # build of an arbitrary ref would be judged against a version string
          # it has nothing to do with.
          case "${CURRENT}::${IMAGE_TAG}" in
            v*.*::v*.*)
              NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$IMAGE_TAG" | sort -V | tail -1)"
              if [ "$NEWEST" != "$IMAGE_TAG" ]; then
                echo "::warning::main is pinned to ${CURRENT}, which is newer than this build (${IMAGE_TAG}) — refusing to move the pin backwards"
                exit 0
              fi
              ;;
          esac

          # BOTH images, one commit. They carry the same OPENCLAW_VERSION and
          # share their scripts, so pinning one without the other would run a
          # CronJob's planner from a different build than the agent it execs
          # into — the kind of skew that shows up as a puzzling ImportError at
          # 00:05 rather than as a failed deploy.
          yq -i \
            "(.images[] | select(.name == \"claw-code-local\") | .newTag) = \"${IMAGE_TAG}\" |
             (.images[] | select(.name == \"claw-code-local-cron\") | .newTag) = \"${IMAGE_TAG}\"" \
            k8s/kustomization.yaml

          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no kustomization tag change"
            exit 0
          fi
          git commit -m "chore: pin claw-code-local images to ${IMAGE_TAG}"
          # Another run may still have pushed between the rebase and here.
          if ! git push; then
            echo "::warning::push raced with another run — the next deploy reapplies the pin"
            exit 0
          fi

  publish-secrets:
    name: Apply Secrets
    runs-on: arc-runner-scale-claw-code-local
    # Renders the openclaw-secrets Secret from GitHub Actions environment
    # secrets and `kubectl apply`s it directly to the cluster — no
    # kubeseal, no committed sealed-secret YAML, no push to main. The
    # manifest is piped from `kubectl create -o yaml` straight into
    # `kubectl apply -f -`, so plaintext never touches disk or git.
    # ArgoCD does NOT manage this Secret; this workflow is the sole
    # owner.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve Versions
        # OPENCLAW_UPSTREAM is read from VERSIONS into the apply step
        # below so the runtime pod knows which upstream tag to track.
        run: |
          . ./VERSIONS
          echo "OPENCLAW_UPSTREAM=${OPENCLAW_UPSTREAM}" >> "$GITHUB_ENV"

      - name: Apply openclaw-secrets to cluster
        # secrets.GITHUB_TOKEN is reserved by GitHub Actions (returns
        # the ephemeral, repo-scoped workflow token, NOT a usable bot
        # PAT). Read the real bot PAT from BOT_GITHUB_TOKEN and apply
        # it under the k8s-side key name `GITHUB_TOKEN` that openclaw
        # expects.
        env:
          MISTRAL_API_KEY:                 ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX_API_KEY:                 ${{ secrets.MINIMAX_API_KEY }}
          MOONSHOT_API_KEY:                ${{ secrets.MOONSHOT_API_KEY }}
          GITHUB_TOKEN:                    ${{ secrets.BOT_GITHUB_TOKEN }}
          ENTRA_TENANT_ID:                 ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_USERNAME:                  ${{ secrets.ENTRA_USERNAME }}
          ENTRA_PASSWORD:                  ${{ secrets.ENTRA_PASSWORD }}
          ENTRA_TOTP_SEED:                 ${{ secrets.ENTRA_TOTP_SEED }}
          GITLAB_TOKEN:                    ${{ secrets.GITLAB_TOKEN }}
          GITLAB_LOCAL_TOKEN:              ${{ secrets.GITLAB_LOCAL_TOKEN }}
          # Optional, and optional in the sense the forge layer means it: set
          # BOTH and Gitea becomes one of the hosts this deployment works;
          # set neither and nothing changes. Half a set is not a host.
          GITEA_URL:                       ${{ secrets.GITEA_URL }}
          GITEA_API_TOKEN:                 ${{ secrets.GITEA_API_TOKEN }}
          # Azure DevOps: the bare organisation NAME, because that is what
          # the CLI and the MCP server take as an argument. The forge builds
          # https://dev.azure.com/<org> from it, so one value serves all three.
          AZDO_ORG:                        ${{ secrets.AZDO_ORG }}
          AZDO_API_TOKEN:                  ${{ secrets.AZDO_API_TOKEN }}
          TELEGRAM_BOT_TOKEN:              ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Comma-separated LAN hostnames the tester's browser plugin may
          # reach (private-network deploy URLs). Not a credential, but kept
          # in the Secret rather than the public config template so the
          # internal DNS domain stays out of git.
          TESTER_ALLOWED_HOSTNAMES:        ${{ secrets.TESTER_ALLOWED_HOSTNAMES }}
          # PEM of the internal CA that signs the cluster's HTTPS ingresses.
          # The tester imports it into Chromium's NSS store at pod start so it
          # can open internal deploy URLs without ERR_CERT_AUTHORITY_INVALID.
          # Optional; kept in the Secret so the internal CA stays out of git.
          INTERNAL_CA_CERT:                ${{ secrets.INTERNAL_CA_CERT }}
          # Comma-separated `owner/repo` list used to SEED the bot's
          # allowed-projects list the first time a workspace volume comes up.
          # After that the list belongs to the `projects` chat skill and lives
          # on the volume, and this value is ignored — so a revoke is never
          # undone by a deploy. Optional: an empty list means the bot starts
          # permitted on nothing, which is the correct default.
          PROJECTS_ALLOWED_BOOTSTRAP:      ${{ secrets.PROJECTS_ALLOWED_BOOTSTRAP }}
        run: |
          kubectl create secret generic openclaw-secrets \
            --namespace claw-code-local \
            --dry-run=client \
            --from-literal=MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --from-literal=MINIMAX_API_KEY="$MINIMAX_API_KEY" \
            --from-literal=MOONSHOT_API_KEY="$MOONSHOT_API_KEY" \
            --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
            --from-literal=ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
            --from-literal=ENTRA_USERNAME="$ENTRA_USERNAME" \
            --from-literal=ENTRA_PASSWORD="$ENTRA_PASSWORD" \
            --from-literal=ENTRA_TOTP_SEED="$ENTRA_TOTP_SEED" \
            --from-literal=GITLAB_TOKEN="$GITLAB_TOKEN" \
            --from-literal=GITLAB_LOCAL_TOKEN="$GITLAB_LOCAL_TOKEN" \
            --from-literal=GITEA_URL="$GITEA_URL" \
            --from-literal=GITEA_API_TOKEN="$GITEA_API_TOKEN" \
            --from-literal=AZDO_ORG="$AZDO_ORG" \
            --from-literal=AZDO_API_TOKEN="$AZDO_API_TOKEN" \
            --from-literal=TESTER_ALLOWED_HOSTNAMES="$TESTER_ALLOWED_HOSTNAMES" \
            --from-literal=INTERNAL_CA_CERT="$INTERNAL_CA_CERT" \
            --from-literal=OPENCLAW_UPSTREAM="$OPENCLAW_UPSTREAM" \
            --from-literal=GOOGLE_APPLICATION_CREDENTIALS="/etc/openclaw/secrets/gcp-service-account.json" \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=PROJECTS_ALLOWED_BOOTSTRAP="$PROJECTS_ALLOWED_BOOTSTRAP" \
            -o yaml \
          | kubectl apply -f -